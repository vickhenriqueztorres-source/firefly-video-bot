[project]
name = "firefly-video-bot"
version = "0.1.0"
description = "Fila resiliente para gerações de vídeo no Adobe Firefly"
requires-python = ">=3.11"
dependencies = [
  "patchright>=1.60.0",
  "humancursor-playwright==0.1.1",
  "python-magic>=0.4.27",
  "python-magic-bin>=0.4.14; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["firefly_bot/tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
